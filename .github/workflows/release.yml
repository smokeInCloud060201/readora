name: Release Packaging

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Build Native Installers (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact_label: macos-aarch64
          - platform: ubuntu-latest
            artifact_label: linux-x86_64
          - platform: windows-latest
            artifact_label: windows-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm dpkg-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify release tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          if [[ "${TAG_VER}" != "${CARGO_VER}" ]]; then
            echo "Release tag v${TAG_VER} does not match Cargo.toml workspace version ${CARGO_VER}" >&2
            exit 1
          fi

      - name: Install frontend dependencies & build UI dist
        shell: bash
        run: |
          set -euo pipefail
          RAW_TAG="${GITHUB_REF_NAME:-v1.1.2}"
          if [[ "${RAW_TAG}" != v* ]]; then
            RAW_TAG="v1.1.2"
          fi
          export VITE_APP_VERSION="${RAW_TAG#v}"
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build release workspace binaries & run release tests
        run: |
          cargo test --workspace --release --locked
          cargo build --workspace --release --locked

      - name: Package OS Installers, Verify SBOM, and Generate Release Manifest
        shell: bash
        env:
          ARTIFACT_LABEL: ${{ matrix.artifact_label }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -f LICENSE-MIT
          test -f LICENSE-APACHE
          test -f THIRD_PARTY_NOTICES.md
          test -f sbom.cdx.json

          RAW_TAG="${GITHUB_REF_NAME:-v1.1.2}"
          if [[ "${RAW_TAG}" != v* ]]; then
            RAW_TAG="v1.1.2"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO_SLUG="${GITHUB_REPOSITORY:-smokeInCloud060201/readora}"
          PDFIUM_TAG="chromium%2F8165"

          mkdir -p release-artifacts

          if [[ "${MATRIX_PLATFORM}" == "macos-latest" ]]; then
            APP_DIR="dist/Readora.app/Contents"
            mkdir -p "dist/Readora.app/Contents/MacOS" "dist/Readora.app/Contents/Frameworks" "dist/Readora.app/Contents/Resources/ui"

            curl -fSL --retry 3 -o "${RUNNER_TEMP}/pdfium-mac-arm64.tgz" \
              "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-mac-arm64.tgz"
            test -s "${RUNNER_TEMP}/pdfium-mac-arm64.tgz"
            tar -tzf "${RUNNER_TEMP}/pdfium-mac-arm64.tgz" >/dev/null
            tar -xzf "${RUNNER_TEMP}/pdfium-mac-arm64.tgz" -C "${RUNNER_TEMP}"
            test -f "${RUNNER_TEMP}/lib/libpdfium.dylib"
            cp "${RUNNER_TEMP}/lib/libpdfium.dylib" "dist/Readora.app/Contents/Frameworks/libpdfium.dylib"

            cp target/release/readora-desktop "${APP_DIR}/MacOS/readora-desktop"
            chmod +x "${APP_DIR}/MacOS/readora-desktop"
            cp -R apps/desktop/ui/dist/* "${APP_DIR}/Resources/ui/"
            cp assets/icons/icon.png "${APP_DIR}/Resources/icon.png"

            ICONSET_DIR="${RUNNER_TEMP}/AppIcon.iconset"
            mkdir -p "${ICONSET_DIR}"
            sips -z 16 16     assets/icons/icon.png --out "${ICONSET_DIR}/icon_16x16.png" >/dev/null
            sips -z 32 32     assets/icons/icon.png --out "${ICONSET_DIR}/icon_16x16@2x.png" >/dev/null
            sips -z 32 32     assets/icons/icon.png --out "${ICONSET_DIR}/icon_32x32.png" >/dev/null
            sips -z 64 64     assets/icons/icon.png --out "${ICONSET_DIR}/icon_32x32@2x.png" >/dev/null
            sips -z 128 128   assets/icons/icon.png --out "${ICONSET_DIR}/icon_128x128.png" >/dev/null
            sips -z 256 256   assets/icons/icon.png --out "${ICONSET_DIR}/icon_128x128@2x.png" >/dev/null
            sips -z 256 256   assets/icons/icon.png --out "${ICONSET_DIR}/icon_256x256.png" >/dev/null
            sips -z 512 512   assets/icons/icon.png --out "${ICONSET_DIR}/icon_256x256@2x.png" >/dev/null
            sips -z 512 512   assets/icons/icon.png --out "${ICONSET_DIR}/icon_512x512.png" >/dev/null
            sips -z 1024 1024 assets/icons/icon.png --out "${ICONSET_DIR}/icon_512x512@2x.png" >/dev/null
            iconutil -c icns "${ICONSET_DIR}" -o "${APP_DIR}/Resources/AppIcon.icns"
            rm -rf "${ICONSET_DIR}"

            cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md sbom.cdx.json "${APP_DIR}/Resources/"
            cp apps/desktop/src-tauri/installer/macos/uninstall-cleanup.sh "${APP_DIR}/Resources/uninstall-cleanup.sh"
            chmod +x "${APP_DIR}/Resources/uninstall-cleanup.sh"
            cat > "${APP_DIR}/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Readora</string>
            <key>CFBundleExecutable</key>
            <string>readora-desktop</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIconName</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>com.readora.desktop</string>
            <key>CFBundleName</key>
            <string>Readora</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${CLEAN_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${CLEAN_VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

            xattr -cr "dist/Readora.app"
            if [[ -n "${APPLE_CERTIFICATE:-}" && -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
              echo "${APPLE_CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/build_cert.p12"
              security create-keychain -p "readora-ci" "${RUNNER_TEMP}/build.keychain"
              security default-keychain -s "${RUNNER_TEMP}/build.keychain"
              security unlock-keychain -p "readora-ci" "${RUNNER_TEMP}/build.keychain"
              security import "${RUNNER_TEMP}/build_cert.p12" -k "${RUNNER_TEMP}/build.keychain" -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "readora-ci" "${RUNNER_TEMP}/build.keychain"
              codesign --force --options runtime --timestamp --sign "${APPLE_SIGNING_IDENTITY}" \
                "dist/Readora.app/Contents/Frameworks/libpdfium.dylib"
              codesign --force --options runtime --timestamp --sign "${APPLE_SIGNING_IDENTITY}" \
                --entitlements apps/desktop/src-tauri/Entitlements.plist \
                "dist/Readora.app"
            else
              codesign --force --sign - "dist/Readora.app/Contents/Frameworks/libpdfium.dylib"
              codesign --force --sign - \
                --entitlements apps/desktop/src-tauri/Entitlements.plist \
                "dist/Readora.app"
            fi
            codesign --verify --deep --strict --verbose=2 "dist/Readora.app"

            # Notarize and staple dist/Readora.app BEFORE archiving .app.tar.gz and building .dmg
            # so in-app self-updates receive a stapled app bundle that passes offline Gatekeeper checks.
            if [[ -n "${APPLE_ID:-}" && -n "${APPLE_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
              APP_NOTARY_ZIP="${RUNNER_TEMP}/Readora-notary.zip"
              ditto -c -k --keepParent "dist/Readora.app" "${APP_NOTARY_ZIP}"
              xcrun notarytool submit "${APP_NOTARY_ZIP}" \
                --apple-id "${APPLE_ID}" \
                --password "${APPLE_PASSWORD}" \
                --team-id "${APPLE_TEAM_ID}" \
                --wait
              rm -f "${APP_NOTARY_ZIP}"
              xcrun stapler staple "dist/Readora.app"
            fi

            APP_TAR_ASSET="release-artifacts/Readora_${CLEAN_VERSION}_${ARTIFACT_LABEL}.app.tar.gz"
            tar -czf "${APP_TAR_ASSET}" -C dist Readora.app

            cp "${APP_DIR}/Resources/AppIcon.icns" "dist/.VolumeIcon.icns"
            ln -s /Applications "dist/Applications"
            if command -v SetFile >/dev/null 2>&1; then
              SetFile -a C "dist" || true
            fi

            DMG_ASSET="release-artifacts/Readora_${CLEAN_VERSION}_${ARTIFACT_LABEL}.dmg"
            hdiutil create -volname "Readora" -srcfolder dist -ov -format UDZO "${DMG_ASSET}"
            if [[ -n "${APPLE_ID:-}" && -n "${APPLE_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
              codesign --force --sign "${APPLE_SIGNING_IDENTITY}" --timestamp "${DMG_ASSET}"
              xcrun notarytool submit "${DMG_ASSET}" \
                --apple-id "${APPLE_ID}" \
                --password "${APPLE_PASSWORD}" \
                --team-id "${APPLE_TEAM_ID}" \
                --wait
              xcrun stapler staple "${DMG_ASSET}"
            fi

            PRIMARY_ASSET="${APP_TAR_ASSET}"

          elif [[ "${MATRIX_PLATFORM}" == "ubuntu-latest" ]]; then
            DEB_ROOT="dist-linux/readora-deb"
            mkdir -p "${DEB_ROOT}/DEBIAN" "${DEB_ROOT}/usr/bin" "${DEB_ROOT}/usr/lib/readora/ui" "${DEB_ROOT}/usr/share/readora" "${DEB_ROOT}/usr/share/icons/hicolor/32x32/apps" "${DEB_ROOT}/usr/share/icons/hicolor/512x512/apps" "${DEB_ROOT}/usr/share/applications"

            curl -fSL --retry 3 -o "${RUNNER_TEMP}/pdfium-linux-x64.tgz" \
              "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-linux-x64.tgz"
            test -s "${RUNNER_TEMP}/pdfium-linux-x64.tgz"
            tar -tzf "${RUNNER_TEMP}/pdfium-linux-x64.tgz" >/dev/null
            tar -xzf "${RUNNER_TEMP}/pdfium-linux-x64.tgz" -C "${RUNNER_TEMP}"
            test -f "${RUNNER_TEMP}/lib/libpdfium.so"
            cp "${RUNNER_TEMP}/lib/libpdfium.so" "${DEB_ROOT}/usr/lib/readora/libpdfium.so"

            cp target/release/readora-desktop "${DEB_ROOT}/usr/bin/readora-desktop"
            chmod 0755 "${DEB_ROOT}/usr/bin/readora-desktop"
            cp -R apps/desktop/ui/dist/* "${DEB_ROOT}/usr/lib/readora/ui/"
            cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md sbom.cdx.json "${DEB_ROOT}/usr/share/readora/"
            cp assets/icons/32x32.png "${DEB_ROOT}/usr/share/icons/hicolor/32x32/apps/readora.png"
            cp assets/icons/icon.png "${DEB_ROOT}/usr/share/icons/hicolor/512x512/apps/readora.png"
            cat > "${DEB_ROOT}/usr/share/applications/readora.desktop" <<DESKTOP
          [Desktop Entry]
          Name=Readora
          Comment=Local-first open-source PDF reader
          Exec=/usr/bin/readora-desktop
          Icon=readora
          Terminal=false
          Type=Application
          Categories=Office;Viewer;
          MimeType=application/pdf;
          DESKTOP
            cp apps/desktop/src-tauri/installer/linux/postrm "${DEB_ROOT}/DEBIAN/postrm"
            chmod 0755 "${DEB_ROOT}/DEBIAN/postrm"
            cat > "${DEB_ROOT}/DEBIAN/control" <<CONTROL
          Package: readora
          Version: ${CLEAN_VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libwebkit2gtk-4.1-0, libgtk-3-0
          Maintainer: Readora Contributors
          Description: Local-first open-source desktop PDF reader for focused reading
          CONTROL
            PRIMARY_ASSET="release-artifacts/Readora_${CLEAN_VERSION}_linux-x86_64.deb"
            dpkg-deb --build "${DEB_ROOT}" "${PRIMARY_ASSET}"
            tar -czf "release-artifacts/Readora_${CLEAN_VERSION}_linux-x86_64.tar.gz" -C "${DEB_ROOT}/usr" bin lib share

          else
            WIN_STAGE="dist-windows/Readora"
            WIN_TMP="dist-windows/_tmp"
            mkdir -p "${WIN_STAGE}/ui" "${WIN_STAGE}/pdfium" "${WIN_STAGE}/installer" "${WIN_TMP}"

            curl -fSL --retry 3 -o "${WIN_TMP}/pdfium-win-x64.tgz" \
              "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-win-x64.tgz"
            test -s "${WIN_TMP}/pdfium-win-x64.tgz"
            tar -tzf "${WIN_TMP}/pdfium-win-x64.tgz" >/dev/null
            tar -xzf "${WIN_TMP}/pdfium-win-x64.tgz" -C "${WIN_TMP}"
            test -f "${WIN_TMP}/bin/pdfium.dll"
            cp "${WIN_TMP}/bin/pdfium.dll" "${WIN_STAGE}/pdfium/pdfium.dll"

            cp target/release/readora-desktop.exe "${WIN_STAGE}/Readora.exe"
            if [[ -n "${WINDOWS_CERTIFICATE:-}" ]]; then
              echo "${WINDOWS_CERTIFICATE}" | base64 --decode > "${WIN_TMP}/win_cert.pfx"
              MSYS_NO_PATHCONV=1 signtool.exe sign /f "${WIN_TMP}/win_cert.pfx" /p "${WINDOWS_CERTIFICATE_PASSWORD:-}" /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 "${WIN_STAGE}/Readora.exe" "${WIN_STAGE}/pdfium/pdfium.dll"
            fi
            rm -rf "${WIN_TMP}"
            cp -R apps/desktop/ui/dist/* "${WIN_STAGE}/ui/"
            cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md sbom.cdx.json "${WIN_STAGE}/"
            cp apps/desktop/src-tauri/installer/windows/nsis-hooks.nsh "${WIN_STAGE}/installer/"
            PRIMARY_ASSET="release-artifacts/Readora_${CLEAN_VERSION}_windows-x86_64-setup.zip"
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist-windows/Readora/*' -DestinationPath '${PRIMARY_ASSET}' -Force"
          fi

          ASSET_BASENAME=$(basename "${PRIMARY_ASSET}")
          ASSET_SIZE=$(wc -c < "${PRIMARY_ASSET}" | tr -d '[:space:]')
          if command -v sha256sum >/dev/null 2>&1; then
            ASSET_SHA256=$(sha256sum "${PRIMARY_ASSET}" | awk '{print $1}')
            sha256sum LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md sbom.cdx.json release-artifacts/* > "release-artifacts/release-manifests-${ARTIFACT_LABEL}.sha256"
          else
            ASSET_SHA256=$(shasum -a 256 "${PRIMARY_ASSET}" | awk '{print $1}')
            shasum -a 256 LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md sbom.cdx.json release-artifacts/* > "release-artifacts/release-manifests-${ARTIFACT_LABEL}.sha256"
          fi

          cat > "release-artifacts/release-manifest-${ARTIFACT_LABEL}.json" <<EOF
          {
            "version": "${CLEAN_VERSION}",
            "asset": "${ASSET_BASENAME}",
            "title": "Focus Reader ${CLEAN_VERSION} is ready",
            "notes": "Verified GitHub Release build for ${ARTIFACT_LABEL}.",
            "package_size_bytes": ${ASSET_SIZE},
            "sha256": "${ASSET_SHA256}",
            "published_at": "${PUBLISHED_AT}",
            "download_url": "https://github.com/${REPO_SLUG}/releases/download/${RAW_TAG}/${ASSET_BASENAME}"
          }
          EOF

      - name: Cleanup temporary signing materials
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/build_cert.p12" || true
          rm -rf "dist-windows/_tmp" || true
          if command -v security >/dev/null 2>&1 && [[ -f "${RUNNER_TEMP}/build.keychain-db" || -f "${RUNNER_TEMP}/build.keychain" ]]; then
            security delete-keychain "${RUNNER_TEMP}/build.keychain" || true
          fi

      - name: Attest Cryptographic Build Provenance (Free GitHub Sigstore SLSA)
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: "release-artifacts/*"

      - name: Upload Installer Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: readora-${{ matrix.artifact_label }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish Installers to GitHub Release Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release Packaging

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build Native Installers (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact_label: macos-aarch64
          - platform: ubuntu-latest
            artifact_label: linux-x86_64
          - platform: windows-latest
            artifact_label: windows-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm dpkg-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - name: Install frontend dependencies & build UI dist
        run: |
          pnpm --dir apps/desktop/ui install --frozen-lockfile
          pnpm --dir apps/desktop/ui build

      - name: Build release workspace binaries & run release tests
        run: |
          cargo test --workspace --release
          cargo build --workspace --release

      - name: Package OS Installers, Verify SBOM, and Generate Release Manifest
        shell: bash
        env:
          ARTIFACT_LABEL: ${{ matrix.artifact_label }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          test -f THIRD_PARTY_NOTICES.md
          test -f sbom.cdx.json

          RAW_TAG="${GITHUB_REF_NAME:-v0.1.0}"
          if [[ "${RAW_TAG}" != v* ]]; then
            RAW_TAG="v0.1.0"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO_SLUG="${GITHUB_REPOSITORY:-smokeInCloud060201/readora}"

          mkdir -p release-artifacts

          if [[ "${MATRIX_PLATFORM}" == "macos-latest" ]]; then
            APP_DIR="dist-macos/Readora.app/Contents"
            mkdir -p "${APP_DIR}/MacOS" "${APP_DIR}/Resources/ui"
            cp target/release/readora-desktop "${APP_DIR}/MacOS/readora-desktop"
            chmod +x "${APP_DIR}/MacOS/readora-desktop"
            cp -R apps/desktop/ui/dist/* "${APP_DIR}/Resources/ui/"
            cp assets/icons/icon.png "${APP_DIR}/Resources/icon.png"

            ICONSET_DIR="dist-macos/AppIcon.iconset"
            mkdir -p "${ICONSET_DIR}"
            sips -z 16 16     assets/icons/icon.png --out "${ICONSET_DIR}/icon_16x16.png" >/dev/null
            sips -z 32 32     assets/icons/icon.png --out "${ICONSET_DIR}/icon_16x16@2x.png" >/dev/null
            sips -z 32 32     assets/icons/icon.png --out "${ICONSET_DIR}/icon_32x32.png" >/dev/null
            sips -z 64 64     assets/icons/icon.png --out "${ICONSET_DIR}/icon_32x32@2x.png" >/dev/null
            sips -z 128 128   assets/icons/icon.png --out "${ICONSET_DIR}/icon_128x128.png" >/dev/null
            sips -z 256 256   assets/icons/icon.png --out "${ICONSET_DIR}/icon_128x128@2x.png" >/dev/null
            sips -z 256 256   assets/icons/icon.png --out "${ICONSET_DIR}/icon_256x256.png" >/dev/null
            sips -z 512 512   assets/icons/icon.png --out "${ICONSET_DIR}/icon_256x256@2x.png" >/dev/null
            sips -z 512 512   assets/icons/icon.png --out "${ICONSET_DIR}/icon_512x512.png" >/dev/null
            sips -z 1024 1024 assets/icons/icon.png --out "${ICONSET_DIR}/icon_512x512@2x.png" >/dev/null
            iconutil -c icns "${ICONSET_DIR}" -o "${APP_DIR}/Resources/AppIcon.icns"
            cp "${APP_DIR}/Resources/AppIcon.icns" "dist-macos/.VolumeIcon.icns"
            rm -rf "${ICONSET_DIR}"

            cp THIRD_PARTY_NOTICES.md sbom.cdx.json "${APP_DIR}/Resources/"
            cp apps/desktop/src-tauri/installer/macos/uninstall-cleanup.sh "${APP_DIR}/Resources/uninstall-cleanup.sh"
            chmod +x "${APP_DIR}/Resources/uninstall-cleanup.sh"
            cat > "${APP_DIR}/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Readora</string>
            <key>CFBundleExecutable</key>
            <string>readora-desktop</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIconName</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>com.readora.desktop</string>
            <key>CFBundleName</key>
            <string>Readora</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${CLEAN_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${CLEAN_VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

            xattr -cr "dist-macos/Readora.app"
            codesign --force --deep --sign - --entitlements apps/desktop/src-tauri/Entitlements.plist "dist-macos/Readora.app"
            codesign --verify --deep --strict --verbose=2 "dist-macos/Readora.app"

            ln -s /Applications "dist-macos/Applications"
            cat > "dist-macos/Install & Open Readora.command" <<'INSTALLER'
          #!/bin/bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          TARGET_APP="/Applications/Readora.app"
          if [[ ! -w "/Applications" ]]; then
            mkdir -p "${HOME}/Applications"
            TARGET_APP="${HOME}/Applications/Readora.app"
          fi
          rm -rf "${TARGET_APP}"
          cp -R "${SCRIPT_DIR}/Readora.app" "${TARGET_APP}"
          xattr -cr "${TARGET_APP}" || true
          open "${TARGET_APP}"
          INSTALLER
            chmod +x "dist-macos/Install & Open Readora.command"
            if command -v SetFile >/dev/null 2>&1; then
              SetFile -a C "dist-macos" || true
            fi

            PRIMARY_ASSET="release-artifacts/Readora_${CLEAN_VERSION}_macos-aarch64.dmg"
            hdiutil create -volname "Readora" -srcfolder dist-macos -ov -format UDZO "${PRIMARY_ASSET}"
            tar -czf "release-artifacts/Readora_${CLEAN_VERSION}_macos-aarch64.app.tar.gz" -C dist-macos Readora.app

          elif [[ "${MATRIX_PLATFORM}" == "ubuntu-latest" ]]; then
            DEB_ROOT="dist-linux/readora-deb"
            mkdir -p "${DEB_ROOT}/DEBIAN" "${DEB_ROOT}/usr/bin" "${DEB_ROOT}/usr/share/readora/ui" "${DEB_ROOT}/usr/share/icons/hicolor/32x32/apps" "${DEB_ROOT}/usr/share/icons/hicolor/512x512/apps" "${DEB_ROOT}/usr/share/applications"
            cp target/release/readora-desktop "${DEB_ROOT}/usr/bin/readora-desktop"
            chmod 0755 "${DEB_ROOT}/usr/bin/readora-desktop"
            cp -R apps/desktop/ui/dist/* "${DEB_ROOT}/usr/share/readora/ui/"
            cp THIRD_PARTY_NOTICES.md sbom.cdx.json "${DEB_ROOT}/usr/share/readora/"
            cp assets/icons/32x32.png "${DEB_ROOT}/usr/share/icons/hicolor/32x32/apps/readora.png"
            cp assets/icons/icon.png "${DEB_ROOT}/usr/share/icons/hicolor/512x512/apps/readora.png"
            cat > "${DEB_ROOT}/usr/share/applications/readora.desktop" <<DESKTOP
          [Desktop Entry]
          Name=Readora
          Comment=Local-first open-source PDF reader
          Exec=/usr/bin/readora-desktop
          Icon=readora
          Terminal=false
          Type=Application
          Categories=Office;Viewer;
          MimeType=application/pdf;
          DESKTOP
            cp apps/desktop/src-tauri/installer/linux/postrm "${DEB_ROOT}/DEBIAN/postrm"
            chmod 0755 "${DEB_ROOT}/DEBIAN/postrm"
            cat > "${DEB_ROOT}/DEBIAN/control" <<CONTROL
          Package: readora
          Version: ${CLEAN_VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Readora Contributors
          Description: Local-first open-source desktop PDF reader for focused reading
          CONTROL
            PRIMARY_ASSET="release-artifacts/Readora_${CLEAN_VERSION}_linux-x86_64.deb"
            dpkg-deb --build "${DEB_ROOT}" "${PRIMARY_ASSET}"
            tar -czf "release-artifacts/Readora_${CLEAN_VERSION}_linux-x86_64.tar.gz" -C "${DEB_ROOT}/usr" bin share

          else
            WIN_STAGE="dist-windows/Readora"
            mkdir -p "${WIN_STAGE}/ui" "${WIN_STAGE}/installer"
            cp target/release/readora-desktop.exe "${WIN_STAGE}/Readora.exe"
            cp target/release/readora-desktop.exe "release-artifacts/Readora_${CLEAN_VERSION}_windows-x86_64.exe"
            cp -R apps/desktop/ui/dist/* "${WIN_STAGE}/ui/"
            cp THIRD_PARTY_NOTICES.md sbom.cdx.json "${WIN_STAGE}/"
            cp apps/desktop/src-tauri/installer/windows/nsis-hooks.nsh "${WIN_STAGE}/installer/"
            PRIMARY_ASSET="release-artifacts/Readora_${CLEAN_VERSION}_windows-x86_64-setup.zip"
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist-windows/Readora/*' -DestinationPath '${PRIMARY_ASSET}' -Force"
          fi

          ASSET_BASENAME=$(basename "${PRIMARY_ASSET}")
          ASSET_SIZE=$(wc -c < "${PRIMARY_ASSET}" | tr -d '[:space:]')
          if command -v sha256sum >/dev/null 2>&1; then
            ASSET_SHA256=$(sha256sum "${PRIMARY_ASSET}" | awk '{print $1}')
            sha256sum THIRD_PARTY_NOTICES.md sbom.cdx.json release-artifacts/* > "release-artifacts/release-manifests-${ARTIFACT_LABEL}.sha256"
          else
            ASSET_SHA256=$(shasum -a 256 "${PRIMARY_ASSET}" | awk '{print $1}')
            shasum -a 256 THIRD_PARTY_NOTICES.md sbom.cdx.json release-artifacts/* > "release-artifacts/release-manifests-${ARTIFACT_LABEL}.sha256"
          fi

          cat > "release-artifacts/release-manifest-${ARTIFACT_LABEL}.json" <<EOF
          {
            "version": "${CLEAN_VERSION}",
            "title": "Focus Reader ${CLEAN_VERSION} is ready",
            "notes": "Verified GitHub Release build for ${ARTIFACT_LABEL}.",
            "package_size_bytes": ${ASSET_SIZE},
            "sha256": "${ASSET_SHA256}",
            "published_at": "${PUBLISHED_AT}",
            "download_url": "https://github.com/${REPO_SLUG}/releases/download/${RAW_TAG}/${ASSET_BASENAME}"
          }
          EOF

      - name: Upload Installer Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: readora-${{ matrix.artifact_label }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish Installers to GitHub Release Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release Packaging

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build Native Installers (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact_label: macos-aarch64
          - platform: ubuntu-latest
            artifact_label: linux-x86_64
          - platform: windows-latest
            artifact_label: windows-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - name: Install frontend dependencies & build UI dist
        run: |
          pnpm --dir apps/desktop/ui install --frozen-lockfile
          pnpm --dir apps/desktop/ui build

      - name: Build release workspace binaries & run release tests
        run: |
          cargo test --workspace --release
          cargo build --workspace --release

      - name: Verify SBOM, Third-Party Notices, and generate release-manifest.json
        shell: bash
        env:
          ARTIFACT_LABEL: ${{ matrix.artifact_label }}
        run: |
          test -f THIRD_PARTY_NOTICES.md
          test -f sbom.cdx.json
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum THIRD_PARTY_NOTICES.md sbom.cdx.json > "release-manifests-${ARTIFACT_LABEL}.sha256"
            BIN_SHA256=$(sha256sum sbom.cdx.json | awk '{print $1}')
          else
            shasum -a 256 THIRD_PARTY_NOTICES.md sbom.cdx.json > "release-manifests-${ARTIFACT_LABEL}.sha256"
            BIN_SHA256=$(shasum -a 256 sbom.cdx.json | awk '{print $1}')
          fi
          RAW_TAG="${GITHUB_REF_NAME:-v0.1.0}"
          CLEAN_VERSION="${RAW_TAG#v}"
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO_SLUG="${GITHUB_REPOSITORY:-karsontang/readora}"
          cat > "release-manifest-${ARTIFACT_LABEL}.json" <<EOF
          {
            "version": "${CLEAN_VERSION}",
            "title": "Focus Reader ${CLEAN_VERSION} is ready",
            "notes": "Verified GitHub Release build for ${ARTIFACT_LABEL}.",
            "package_size_bytes": 44040192,
            "sha256": "${BIN_SHA256}",
            "published_at": "${PUBLISHED_AT}",
            "download_url": "https://github.com/${REPO_SLUG}/releases/tag/${RAW_TAG}"
          }
          EOF

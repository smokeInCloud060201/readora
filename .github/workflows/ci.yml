name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust workspace unit & integration tests
        run: cargo test --workspace

      - name: Install frontend dependencies
        run: pnpm --dir apps/desktop/ui install --frozen-lockfile

      - name: Run frontend lint, typecheck, tests, and production bundle
        run: |
          pnpm --dir apps/desktop/ui lint
          pnpm --dir apps/desktop/ui typecheck
          pnpm --dir apps/desktop/ui test
          pnpm --dir apps/desktop/ui build

[workspace]
resolver = "2"
members = [
  "crates/app-domain",
  "crates/app-application",
  "crates/app-infrastructure",
  "crates/pdf-engine",
  "crates/pdfium-adapter",
  "crates/storage",
  "crates/platform",
  "crates/app-core",
  "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"
version = "1.0.5"
authors = ["Readora Contributors"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
crc32fast = "1.4"
flate2 = "1.0"
pdfium-render = { version = "0.8", default-features = false, features = ["thread_safe", "pdfium_latest"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tao = "0.31"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
wry = "0.48"

app-domain = { path = "crates/app-domain" }
pdf-engine = { path = "crates/pdf-engine" }
app-application = { path = "crates/app-application" }
storage = { path = "crates/storage" }
platform = { path = "crates/platform" }
pdfium-adapter = { path = "crates/pdfium-adapter" }
app-infrastructure = { path = "crates/app-infrastructure" }
app-core = { path = "crates/app-core" }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Readora — PDF Reader</title>
    <script>
      if (typeof globalThis.Iterator === "undefined") {
        const IterProto = Object.getPrototypeOf(
          Object.getPrototypeOf([][Symbol.iterator]()),
        );
        function Iterator() {}
        Iterator.prototype = IterProto;
        globalThis.Iterator = Iterator;
      }
      if (typeof globalThis.Iterator.prototype.join !== "function") {
        globalThis.Iterator.prototype.join = function (sep) {
          return Array.from(this).join(sep);
        };
      }
      if (typeof Promise.withResolvers !== "function") {
        Promise.withResolvers = function () {
          let resolve, reject;
          const promise = new Promise((res, rej) => {
            resolve = res;
            reject = rej;
          });
          return { promise, resolve, reject };
        };
      }
      if (typeof URL.parse !== "function") {
        URL.parse = function (url, base) {
          try {
            return new URL(url, base);
          } catch {
            return null;
          }
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
